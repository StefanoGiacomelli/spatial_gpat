[pytest]
# Collect ONLY the data-free tests in tests/.  The scripts analysis/**/test_*.py
# are data-dependent profiling/diagnostic *scripts* (they need datasets,
# checkpoints and an accelerator) and must not be collected by pytest.
testpaths = tests
python_files = test_*.py
norecursedirs = analysis runs data results figures .venv .git
addopts = -p no:cacheprovider -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
