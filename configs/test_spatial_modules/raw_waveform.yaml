# Raw-waveform front-ends
# SoundDoA (Interspeech 2022) — Gabor: n_filters=128, kernel=1024, stride=600, sr=24000

gabor_filter_bank:
  n_filters: 128          # -> 256 output channels (real + imag); SoundDoA value
  kernel_length: 1024
  stride: 600
  sr: 24000
  fmin: 50.0
  fmax: 8000.0

gabor_front_end:
  n_filters: 128
  kernel_length: 1024
  stride: 600
  n_mics: 4
  format: "foa"
  sr: 24000
  fmin: 50.0
  fmax: 8000.0

formant_enhancement:
  n_channels: 7           # n_spatial = 1 + 2*(n_mics-1) for 4-mic FOA
  kernel_size: [3, 1]

test:
  batch_size: 1
  n_mics: 4
  t_samples: 24000        # 1 s at 24 kHz
  n_spatial: 7            # 1 + 2*(4-1)
