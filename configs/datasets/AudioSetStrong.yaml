data:
  audio_root_train:      data/audioset-qiuqiangkong/balanced_train_segments
  audio_root_unbalanced: data/audioset-qiuqiangkong/unbalanced_strong
  audio_root_test:       data/audioset-qiuqiangkong/eval_segments
  strong_tsv_train:      data/audioset-qiuqiangkong/metadata/audioset_train_strong.tsv
  strong_tsv_test:       data/audioset-qiuqiangkong/metadata/audioset_eval_strong.tsv
  class_map:             configs/datasets/audioset_strong_label_map.csv
  val_fraction:          0.2
  val_seed:              42
  num_workers:           4
  overlap_threshold:     0.0
  hlp_enabled:           true
  hlp_table_path:        configs/datasets/audioset_strong_hlp.pt

augmentation:
  enabled:      false
  p_gain:       0.3
  gain_db:      6.0
  p_noise:      0.3
  noise_snr_db: 35.0

semantic:
  pretrained_class_map:      data/audioset-qiuqiangkong/metadata/class_labels_indices.csv
  model_class_map:           configs/datasets/audioset_strong_label_map.csv
  mid_to_display_name_tsv:   data/audioset-qiuqiangkong/metadata/mid_to_display_name.tsv
