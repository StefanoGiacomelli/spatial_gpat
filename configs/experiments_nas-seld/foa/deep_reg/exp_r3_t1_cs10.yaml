# deep_reg — early=3 ResBlock | late=1x TrackTransformer | smooth=1 BiGRU
# CrossStitch early=true  late=false
# Regularization: spatial_early.dropout=0.4, spatial_late.dropout=0.3, bigru.dropout=0.3

experiment:
  name: exp_r3_t1_cs10
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: true
  cs_late_enabled:  false
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 3
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]
  dropout: 0.4

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 2
  dropout: 0.3

track_smoothing_spatial:
  type: bigru
  n_layers: 1
  hidden_size: 256
  dropout: 0.3

heads:
  n_tracks: 2

data:
  format: foa

training:
  epochs:           100
  batch_size:       2
  patience:         20
  
  lambda_spatial:   0.9
  lambda_semantic:  0.1
  beta_sed:         0.7
  focal_gamma:      0.0
  angle_thresh:     20.0
  
  lr:               5.0e-4
  lr_reduce_factor: 0.75
  lr_patience:      20
  lr_min:           1.0e-5
  
  pos_weight_max:   20.0
  
  window_s:         10.0
  hop_s:            2.5
