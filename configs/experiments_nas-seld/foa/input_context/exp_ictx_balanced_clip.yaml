# NAS-SELD input context extension: full-clip mode, BalancedSTARSS23
# Architecture: exp_ft_tau2019_focal (resnet_block×3 + TT×1) + BiGRU upgrades from exp_topt_BiGRU_n2_h512_merge_sum
# Full-clip mode: data.window_s is null → runner uses variable-length clips with collate_fn padding.
# STARSS23 train clips: 32.5 s – 388.6 s (mean 162 s); TAU-NIGENS: 60 s; TAU2019: ~60 s.
# collate_fn pads each batch to the longest item; with batch_size=1 no padding occurs.
# Runner: main_nas-seld.py --dataset BalancedSTARSS23
# Note: --window-s / --hop-s omit from CLI (runner reads data.window_s=null from YAML → full-clip).

experiment:
  name: exp_ictx_balanced_clip
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  dataset:    BalancedSTARSS23
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  true
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 3
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]
  dropout: 0.1

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 3
  dropout: 0.1

track_smoothing_spatial:
  type: bigru
  n_layers: 2          # was 1 — hierarchical temporal depth
  hidden_size: 512     # was 256 — larger working memory for long clips (up to ~39k frames)
  merge_mode: sum      # was implicit 'mul' — additive merge
  dropout: 0.1

heads:
  n_tracks:  3
  n_classes: 13

data:
  format:       foa
  window_s:     null    # full-clip mode — runner reads null → windowed=False
  hop_s:        null    # unused in full-clip mode
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0

training:
  epochs:           100
  batch_size:       1       # effective_batch=16 via accumulate_grad_batches=16
  patience:         30

  lambda_spatial:   0.9
  lambda_semantic:  0.1
  beta_sed:         0.9
  focal_gamma:      2.0
  angle_thresh:     20.0

  pos_weight_max:   20.0

  lr:               5.0e-4
  lr_reduce_factor: 0.75
  lr_patience:      10
  lr_min:           1.0e-5
