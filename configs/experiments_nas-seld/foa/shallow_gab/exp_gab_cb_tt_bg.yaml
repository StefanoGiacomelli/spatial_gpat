# NAS Experiment — exp_gab_cb_tt_bg
# Input: gabor  |  SpatialEarly: ConvBlock
# SpatialLate: TrackTransf  |  Smoother: BiGRU

experiment:
  name: exp_gab_cb_tt_bg
  seed: 42

input:
  type: gabor
  sr: 32000
  n_mics: 4
  stride: 320
  n_filters: 128
  kernel_length: 1024
  format: foa
  fmin: 50.0
  fmax: 16000.0

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled: false
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: convblock
  n_layers: 1
  out_channels: 64
  kernel_size: [3, 3]
  pool_size: 1
  dropout: 0.0

spatial_late:
  type: track_transformer
  d_model: 128
  n_heads: 4
  n_tracks: 2

track_smoothing_spatial:
  type: bigru
  n_layers: 1
  hidden_size: 256
  dropout: 0.0

heads:
  n_tracks: 2

data:
  format: foa

training:
  epochs:           20
  batch_size:       16
  patience:         10
  
  lambda_spatial:   0.8
  lambda_semantic:  0.2
  beta_sed:         0.6
  focal_gamma:      0.0
  angle_thresh:     20.0
  
  lr:               5.0e-4
  lr_reduce_factor: 0.75
  lr_patience:      20
  lr_min:           1.0e-5
  
  pos_weight_max:   20.0
  
  window_s:         10.0
  hop_s:            2.5
