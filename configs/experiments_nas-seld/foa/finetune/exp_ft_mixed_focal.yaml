# Phase 4 fine-tuning — mixed STARSS23 + TAU-NIGENS2021, focal loss
# Architecture: exp_r3_t1_cs01 (Phase 3 winner)
# Loss: focal loss (focal_gamma=2.0) — ablation vs. exp_ft_mixed_bce

experiment:
  name: exp_ft_mixed_focal
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  true
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 3
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]
  dropout: 0.4

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 2
  dropout: 0.3

track_smoothing_spatial:
  type: bigru
  n_layers: 1
  hidden_size: 256
  dropout: 0.3

heads:
  n_tracks: 2

data:
  format: foa

augmentation:
  enabled: true
  p_rotate:    0.5
  p_gain:      0.5
  p_elevflip:  0.3
  gain_min_db: -6.0
  gain_max_db:  6.0

training:
  focal_gamma:    2.0    # focal loss — ablation vs. exp_ft_mixed_bce
  pos_weight_max: 20.0
