# Phase 4 fine-tuning — mixed STARSS23 + TAU-NIGENS2021, standard BCE, low dropout
# Architecture: exp_r3_t1_cs01 (Phase 3 winner)
# Loss: standard BCE (focal_gamma=0.0)
# Dropout: early=0.2, late=0.1, smoothing=0.1 (reduced from 0.4/0.3/0.3)
# Scheduler: ReduceLROnPlateau (injected by _build_finetune_cfg)

experiment:
  name: exp_ft_mixed_bce_rlrp
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  true
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 3
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]
  dropout: 0.1

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 2
  dropout: 0.1

track_smoothing_spatial:
  type: bigru
  n_layers: 1
  hidden_size: 256
  dropout: 0.1

heads:
  n_tracks: 2

data:
  format: foa
  # starss_root, tau_root, window_s, hop_s, val_fraction, val_seed, num_workers
  # are injected at runtime by _build_finetune_cfg() in main_finetune.py

augmentation:
  enabled: true
  p_rotate:    0.5
  p_gain:      0.5
  p_elevflip:  0.3
  gain_min_db: -6.0
  gain_max_db:  6.0

training:
  focal_gamma:    0.0    # standard BCE
  pos_weight_max: 20.0
  # lr, epochs, batch_size, lambda_spatial, lambda_semantic, beta_sed,
  # angle_thresh, lr_reduce_factor, lr_patience, lr_min
  # are injected by _build_finetune_cfg() from CLI defaults
