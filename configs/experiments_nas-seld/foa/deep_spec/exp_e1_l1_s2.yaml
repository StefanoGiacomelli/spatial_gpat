# Deep NAS — base: spe_rn_tt_bg
# early=1  |  late=1  |  smooth=2

experiment:
  name: exp_e1_l1_s2
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled: false
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 1
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 2

track_smoothing_spatial:
  type: bigru
  n_layers: 2
  hidden_size: 256
  dropout: 0.0

heads:
  n_tracks: 2

data:
  format: foa

training:
  epochs:           100
  batch_size:       2
  patience:         20
  
  lambda_spatial:   0.9
  lambda_semantic:  0.1
  beta_sed:         0.7
  focal_gamma:      0.0
  angle_thresh:     20.0
  
  lr:               5.0e-4
  lr_reduce_factor: 0.75
  lr_patience:      20
  lr_min:           1.0e-5
  
  pos_weight_max:   20.0
  
  window_s:         10.0
  hop_s:            2.5
