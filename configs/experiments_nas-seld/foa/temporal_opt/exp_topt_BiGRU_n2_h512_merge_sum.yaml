# NAS-SELD temporal-opt: BiGRU smoother improvements
# Base: exp_ft_mixed_focal.yaml (Phase 4 winner, arch = exp_r3_t1_cs01)
# Target module: track_smoothing_spatial (BiGRU)
# Changes vs base:
#   track_smoothing_spatial.n_layers:   2   (was 1; adds hierarchical temporal depth)
#   track_smoothing_spatial.hidden_size: 512 (was 256; doubles working memory over T≈1000)
#   track_smoothing_spatial.merge_mode: sum  (was implicit 'mul'; additive merge) [requires P4]

experiment:
  name: exp_topt_BiGRU_n2_h512_merge_sum
  seed: 42

input:
  type: spectral
  sr: 32000
  n_mics: 4
  hop_length: 320
  n_fft: 512

semantic:
  dataset:    BalancedSTARSS23
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained, frozen: false}

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  true
  C_bridge_early: 64
  C_bridge_late: 128

spatial_early:
  type: resnet_block
  n_layers: 3
  out_channels: 64
  use_msca: true
  msca_reduction: 4
  stride: [1, 1]
  dropout: 0.1

spatial_late:
  type: track_transformer
  n_layers: 1
  d_model: 128
  n_heads: 4
  n_tracks: 3
  dropout: 0.1

track_smoothing_spatial:
  type: bigru
  n_layers: 2          # was 1 — second layer adds hierarchical temporal depth
  hidden_size: 512     # was 256 — doubles BiGRU working memory
  dropout: 0.1
  merge_mode: sum      # was implicit 'mul' — additive merge lets fwd/bwd contribute independently

heads:
  n_tracks:  3
  n_classes: 13

data:
  format:       foa
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0

training:
  epochs:           100
  batch_size:       2
  patience:         30

  lambda_spatial:   0.9
  lambda_semantic:  0.1
  beta_sed:         0.85
  focal_gamma:      2.0
  angle_thresh:     20.0

  pos_weight_max:   20.0

  lr:               5.0e-4
  lr_reduce_factor: 0.75
  lr_patience:      10
  lr_min:           1.0e-5

  window_s:         10.0
  hop_s:            2.5
