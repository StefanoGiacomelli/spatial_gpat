experiment:
  name: seld_v2_mixed
  seed: 42

input:
  type:        spectral
  sr:          24000          # native dataset SR — no resampling overhead
  n_mics:      4
  n_fft:       1024           # 512 freq bins; finer resolution for IV + SED
  hop_length:  240            # sr // 100 = 10 ms frame shift (= 100 ms annotation / 10)
  compute_iv:  true           # FOA intensity vectors (3 extra channels)

# ── Early stage: CNN frontend (freq reduction) + ConformerBlock stack ──────────
spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.15        # slightly higher for mixed dataset regularisation

# ── Late stage: per-track Transformer ─────────────────────────────────────────
spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3                 # MixedSELD uses STARSS23 polyphony (up to 3 sources)
  dropout:  0.15

# ── Temporal smoother: per-track TCN with shared weights ──────────────────────
track_smoothing:
  type:        tcn
  d_model:     128            # per-track dim — must equal spatial_late.d_model
  n_layers:    6
  kernel_size: 3
  dropout:     0.15

# ── Output heads ──────────────────────────────────────────────────────────────
heads:
  n_tracks:  3                # must match spatial_late.n_tracks
  n_classes: 13
  proj_dim:  null

# ── Cross-stitching between SED and DOA branches ──────────────────────────────
cross_stitch:
  cs_early_enabled: true      # enabled for mixed training to link SED↔DOA branches
  cs_late_enabled:  true

# ── Training ──────────────────────────────────────────────────────────────────
training:
  dataset_mode:     MixedSELD
  beta_sed:         0.6
  focal_gamma:      0.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  weighted_sampler: true      # balance STARSS23 vs TAU-NIGENS2021 samples
  lr:               3.0e-4
  lr_warmup_epochs: 5         # linear 1e-3→1.0 ramp, then cosine annealing
  lr_min:           1.0e-5

# ── Data augmentation ─────────────────────────────────────────────────────────
augmentation:
  enabled:     true
  p_rotate:    0.5
  p_gain:      0.5
  p_elevflip:  0.3
  gain_min_db: -6.0
  gain_max_db:  6.0

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  starss_root:  data/STARSS23
  tau_root:     data/TAU-NIGENS2021
  window_s:     10.0
  hop_s:        5.0
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
