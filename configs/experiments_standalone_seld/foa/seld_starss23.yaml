experiment:
  name: seld_starss23
  seed: 42

input:
  type:       spectral
  sr:         32000
  n_mics:     4
  n_fft:      512
  hop_length: 320
  compute_iv: true

spatial_early:
  type:           resnet_block
  n_layers:       3
  out_channels:   64
  use_msca:       true
  msca_reduction: 4
  stride:         [1, 1]
  dropout:        0.0

spatial_late:
  type:     track_transformer
  n_layers: 1
  d_model:  128
  n_heads:  4
  n_tracks: 2
  dropout:  0.0

track_smoothing:
  type:        bigru
  n_layers:    1
  hidden_size: 256
  dropout:     0.0

heads:
  n_tracks:  2
  n_classes: 13

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false

training:
  dataset_mode:    STARSS23
  beta_sed:        0.6
  focal_gamma:     0.0
  pos_weight_max:  20.0
  angle_thresh:    20.0
  weighted_sampler: false

augmentation:
  enabled:      false
  p_rotate:     0.5
  p_gain:       0.5
  p_elevflip:   0.3
  gain_min_db:  -6.0
  gain_max_db:   6.0

data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        5.0
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4

