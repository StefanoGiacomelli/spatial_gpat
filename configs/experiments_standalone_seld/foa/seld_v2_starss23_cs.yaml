experiment:
  name: seld_v2_starss23
  seed: 42

input:
  type:        spectral
  sr:          24000          # native dataset SR — no resampling overhead
  n_mics:      4
  n_fft:       1024           # 512 freq bins; finer resolution for IV + SED
  hop_length:  240            # sr // 100 = 10 ms frame shift (= 100 ms annotation / 10)
  compute_iv:  true           # FOA intensity vectors (3 extra channels)

# ── Early stage: CNN frontend (freq reduction) + ConformerBlock stack ──────────
spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128         # output dim; CNN: 11 → 64 → 128; Conformer d_model
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31          # 31 frames × 10 ms = 310 ms local context per block
  dropout:        0.1

# ── Late stage: per-track Transformer ─────────────────────────────────────────
spatial_late:
  type:     track_transformer
  n_layers: 2                 # increased from 1; better track separation
  d_model:  128               # must match spatial_early.d_model
  n_heads:  4
  n_tracks: 3                 # STARSS23 supports up to 3 simultaneous sources
  dropout:  0.1

# ── Temporal smoother: per-track TCN with shared weights ──────────────────────
track_smoothing:
  type:        tcn
  d_model:     128            # per-track dim — must equal spatial_late.d_model
  n_layers:    6              # RF = 3 × (2^6 − 1) = 189 frames ≈ 1.9 s
  kernel_size: 3
  dropout:     0.1

# ── Output heads ──────────────────────────────────────────────────────────────
heads:
  n_tracks:  3                # must match spatial_late.n_tracks
  n_classes: 13
  proj_dim:  null             # optional Linear(d_smooth, proj_dim)+GELU before head

# ── Cross-stitching between SED and DOA branches ──────────────────────────────
cross_stitch:
  cs_early_enabled: true     # after ConformerBlock stack; (B, T, d_model)
  cs_late_enabled:  true     # after TrackTransformer;   (B, T, n_tracks*d_model)

# ── Training ──────────────────────────────────────────────────────────────────
training:
  dataset_mode:     STARSS23
  beta_sed:         0.6
  focal_gamma:      0.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  weighted_sampler: false
  lr:               3.0e-4
  lr_warmup_epochs: 5         # linear 1e-3→1.0 ramp, then cosine annealing
  lr_min:           1.0e-5

# ── Data augmentation (SELDAugment is wired; FOA rotation+gain+elevflip) ──────
augmentation:
  enabled:     true
  p_rotate:    0.5
  p_gain:      0.5
  p_elevflip:  0.3
  gain_min_db: -6.0
  gain_max_db:  6.0

# ── Data ──────────────────────────────────────────────────────────────────────
data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        5.0
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
