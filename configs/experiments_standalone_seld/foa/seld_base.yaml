experiment:
  name: seld_base
  seed: 42

input:
  type:       spectral
  sr:         32000
  n_mics:     4
  n_fft:      512
  hop_length: 320
  compute_iv: true

spatial_early:
  type:           resnet_block
  n_layers:       3
  out_channels:   64
  use_msca:       true
  msca_reduction: 4
  stride:         [1, 1]
  dropout:        0.2

spatial_late:
  type:     track_transformer
  n_layers: 1
  d_model:  128
  n_heads:  4
  n_tracks: 2
  dropout:  0.1

track_smoothing:
  type:        bigru
  n_layers:    1
  hidden_size: 256
  dropout:     0.1

heads:
  n_tracks:  2
  n_classes: 13

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false
