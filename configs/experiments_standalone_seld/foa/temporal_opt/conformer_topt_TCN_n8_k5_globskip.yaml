# Standalone SELD temporal-opt: TCN smoother improvements (Conformer pipeline)
# Base: conformer_starss23_cs_specaug_focal.yaml
# Target module: track_smoothing (TCN)
# Changes vs base:
#   track_smoothing.n_layers:    8     (was 6; RF: 189 frames → 1275 frames ≈ 12.75 s)
#   track_smoothing.kernel_size: 5     (was 3; wider per-block contribution at each dilation)
#   track_smoothing.global_skip: true  (was absent/false; direct gradient path for deeper stack) [requires P5]
# RF formula: k × (2^n − 1) = 5 × (2^8 − 1) = 5 × 255 = 1275 frames ≈ 12.75 s

experiment:
  name: conformer_topt_TCN_n8_k5_globskip
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        tcn
  d_model:     128
  n_layers:    8           # was 6 — RF: 5×(2⁸−1)=1275 frames ≈ 12.75 s (full-window coverage)
  kernel_size: 5           # was 3 — wider depthwise kernel at each dilation level
  dropout:     0.1
  global_skip: true        # was absent — additive skip from TCN input to output for gradient flow

heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: true
  cs_late_enabled:  false

training:
  dataset_mode:     STARSS23
  epochs:           100
  batch_size:       2
  patience:         30
  beta_sed:         0.9
  focal_gamma:      2.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        cosine
  lr_warmup_epochs: 5
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         true
    n_freq_masks:    2
    freq_mask_param: 20
    n_time_masks:    2
    time_mask_param: 30

data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
