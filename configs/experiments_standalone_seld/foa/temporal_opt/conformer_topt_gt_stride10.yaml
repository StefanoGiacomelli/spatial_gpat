# Standalone SELD temporal-opt: GT resolution alignment (Conformer pipeline)
# Base: conformer_starss23_cs_specaug_focal.yaml
# Target: training loop (loss computation)
# Changes vs base:
#   training.gt_stride: 10  (was absent/1; decimates predictions+targets by 10 before tPIT loss)
# Effect: aligns supervision granularity with 100 ms GT annotations (model frames are 10 ms),
#         eliminating the 10× label duplication that introduces correlated gradients.
# Inference output is unchanged — still at full T≈1000 resolution.
# [requires P6]

experiment:
  name: conformer_topt_gt_stride10
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        tcn
  d_model:     128
  n_layers:    6
  kernel_size: 3
  dropout:     0.1

heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: true
  cs_late_enabled:  true

training:
  dataset_mode:     STARSS23
  epochs:           50
  batch_size:       8
  patience:         30
  beta_sed:         0.8
  focal_gamma:      2.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        cosine
  lr_warmup_epochs: 5
  lr_min:           1.0e-5
  gt_stride:        10     # was absent (default 1) — decimate to 100 ms GT resolution before tPIT loss

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         true
    n_freq_masks:    2
    freq_mask_param: 20
    n_time_masks:    2
    time_mask_param: 30

data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
