# Standalone SELD temporal-opt: TrackTransformer improvements (ResNet pipeline)
# Base: resnet_starss23_specaug_focal.yaml
# Target module: spatial_late (TrackTransformer)
# Changes vs base:
#   spatial_late.ffn_expansion: 6   (was implicit 4; dim_ff 512 → 768 per TT layer) [requires P2]
#   spatial_late.n_layers:      3   (was 2; third attention pass for deeper track-level refinement)
#   spatial_late.n_tracks:      4   (was 3; extra track learns silence via tPIT)
#   heads.n_tracks:             4   (must match spatial_late.n_tracks)
# Note: ResNet early stage has no MHSA — TT is the only source of global temporal context,
#       making improvements to this module especially high-priority for this pipeline.

experiment:
  name: resnet_topt_TT_ffn6_n3_n_tracks4
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           resnet_block
  n_layers:       2
  out_channels:   64
  d_model:        128
  use_msca:       true
  msca_reduction: 4
  dropout:        0.1

spatial_late:
  type:          track_transformer
  n_layers:      3             # was 2 — third TT layer adds another self-attention pass per track
  d_model:       128
  n_heads:       4
  n_tracks:      4             # was 3 — extra track for assignment stability
  ffn_expansion: 6             # was implicit 4 — TT FFN dim 512 → 768 per layer
  dropout:       0.1

track_smoothing:
  type:        bigru
  hidden_size: 256
  n_layers:    1
  dropout:     0.1

heads:
  n_tracks:  4                 # was 3 — must match spatial_late.n_tracks
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false

training:
  dataset_mode:     STARSS23
  epochs:           100
  batch_size:       2
  patience:         30
  beta_sed:         0.9
  focal_gamma:      2.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        reduce_on_plateau
  lr_reduce_factor: 0.75
  lr_patience:      10
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         true
    n_freq_masks:    2
    freq_mask_param: 20
    n_time_masks:    2
    time_mask_param: 30

data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
