# Standalone SELD temporal-opt: BiGRU smoother improvements (ResNet pipeline)
# Base: resnet_starss23_specaug_focal.yaml
# Target module: track_smoothing (BiGRU)
# Changes vs base:
#   track_smoothing.n_layers:   2    (was 1; hierarchical temporal depth)
#   track_smoothing.hidden_size: 512 (was 256; doubles working memory over T≈1000 frames)
#   track_smoothing.merge_mode: sum  (was implicit 'mul'; additive merge) [requires P4]
# Note: In the ResNet pipeline the BiGRU is the ONLY sequential temporal smoother
#       (no TCN), making depth/size improvements here especially impactful.
# Risk: ~3× larger smoother than base; monitor train vs val SELD gap for overfitting.

experiment:
  name: resnet_topt_GRU_n2_h512_merge_sum
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           resnet_block
  n_layers:       2
  out_channels:   64
  d_model:        128
  use_msca:       true
  msca_reduction: 4
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        bigru
  n_layers:    2           # was 1 — second BiGRU layer adds hierarchical temporal depth
  hidden_size: 512         # was 256 — doubles per-direction working memory
  dropout:     0.1
  merge_mode:  sum         # was implicit 'mul' — additive merge for independent fwd/bwd contributions

heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false

training:
  dataset_mode:     STARSS23
  epochs:           50
  batch_size:       2
  patience:         30
  beta_sed:         0.8
  focal_gamma:      2.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        reduce_on_plateau
  lr_reduce_factor: 0.75
  lr_patience:      5
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         true
    n_freq_masks:    2
    freq_mask_param: 20
    n_time_masks:    2
    time_mask_param: 30

data:
  root_path:    data/STARSS23
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
