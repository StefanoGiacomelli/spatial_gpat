experiment:
  name: conformer_mixed_specaug
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

# ── Early stage: CNN frontend (freq reduction) + ConformerBlock stack ──────────
spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.1

# ── Late stage: per-track Transformer ─────────────────────────────────────────
spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

# ── Temporal smoother: per-track TCN with shared weights ──────────────────────
track_smoothing:
  type:        tcn
  d_model:     128
  n_layers:    6
  kernel_size: 3
  dropout:     0.1

# ── Output heads ──────────────────────────────────────────────────────────────
heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

# ── Cross-stitching between SED and DOA branches ──────────────────────────────
cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false

# ── Training ──────────────────────────────────────────────────────────────────
training:
  dataset_mode:     BalancedSTARSS23
  epochs:           200
  batch_size:       4
  patience:         30
  beta_sed:         0.6
  focal_gamma:      0.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        cosine
  lr_warmup_epochs: 5
  lr_min:           1.0e-5

# ── Data augmentation ─────────────────────────────────────────────────────────
augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         true
    n_freq_masks:    2
    freq_mask_param: 20      # 3.9% of 512 freq bins — conservative for FOA
    n_time_masks:    2
    time_mask_param: 30      # 300 ms max per mask (3% of 10s clip)

# ── Data — roots injected at runtime via CLI (--starss-root / --tau-root / --tau2019-root)
data:
  window_s:     10.0
  hop_s:        2.5
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
