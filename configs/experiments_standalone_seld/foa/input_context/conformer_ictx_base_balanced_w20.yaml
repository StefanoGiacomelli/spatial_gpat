# Standalone SELD input context extension: Conformer base, 20 s window, BalancedSTARSS23
# Architecture: conformer_starss23_cse (conformer×4 + TT×2 + TCN×6, cs_early=true)
# Dataset: BalancedSTARSS23 (STARSS23 + TAU-NIGENS2021 + TAU2019, 13-class greedy balancing + FOA mixup)
# Window: 20 s / hop 2 s — data paths injected by runner (--starss-root / --tau-root / --tau2019-root)

experiment:
  name: conformer_ictx_base_balanced_w20
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        tcn
  d_model:     128
  n_layers:    6
  kernel_size: 3
  dropout:     0.1

heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: true
  cs_late_enabled:  false

training:
  dataset_mode:     BalancedSTARSS23
  epochs:           100
  batch_size:       2       # effective_batch=32 via accumulate_grad_batches=16
  patience:         30
  beta_sed:         0.9
  focal_gamma:      0.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  weighted_sampler: false
  lr:               3.0e-4
  scheduler:        cosine
  lr_warmup_epochs: 5
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0

data:
  window_s:     20.0
  hop_s:        2.0
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
