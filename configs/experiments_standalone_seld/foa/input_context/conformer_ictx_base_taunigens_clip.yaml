# Standalone SELD input context extension: Conformer base, full-clip mode, TAU-NIGENS2021
# Architecture: conformer_starss23_cse (conformer×4 + TT×2 + TCN×6, cs_early=true)
# Dataset: TAU-NIGENS2021 — all clips exactly 60 s → T_mel=6001 frames, no variability in batch
# collate_fn pads each batch to the longest item; with batch_size=1 no padding occurs
# Runner: main_standalone_seld.py --config-file <this_file>
# Note: --window-s / --hop-s omit from CLI (runner reads data.window_s=null → full-clip)

experiment:
  name: conformer_ictx_base_taunigens_clip
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           conformer
  use_msca:       true
  msca_reduction: 4
  d_model:        128
  n_conf_layers:  4
  n_heads:        4
  ffn_expansion:  4
  conv_kernel:    31
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        tcn
  d_model:     128
  n_layers:    6
  kernel_size: 3
  dropout:     0.1

heads:
  n_tracks:  3
  n_classes: 12
  proj_dim:  null

cross_stitch:
  cs_early_enabled: true
  cs_late_enabled:  false

training:
  dataset_mode:     TAU-NIGENS2021
  epochs:           100
  batch_size:       1       # effective_batch=32 via accumulate_grad_batches=32
  patience:         30
  beta_sed:         0.9
  focal_gamma:      0.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  weighted_sampler: false
  lr:               3.0e-4
  scheduler:        cosine
  lr_warmup_epochs: 5
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0

data:
  root_path:    data/TAU-NIGENS2021
  window_s:     null    # full-clip mode — runner reads null → windowed=False
  hop_s:        null    # unused in full-clip mode
  val_fraction: 0.2     # ignored — TAU-NIGENS2021 uses fixed dev split
  val_seed:     42
  num_workers:  4
