# Standalone SELD input context extension: ResNet base, 40 s window, BalancedSTARSS23
# Architecture: resnet_starss23 (resnet_block×2 + TT×2 + BiGRU×1, cs_early=false, cs_late=false)
# Dataset: BalancedSTARSS23 (STARSS23 + TAU-NIGENS2021 + TAU2019, 13-class greedy balancing + FOA mixup)
# Window: 40 s / hop 2 s — data paths injected by runner (--starss-root / --tau-root / --tau2019-root)
# _expand_to_windows: 50% threshold (start + ws//2 <= n) — includes clips >= 20 s real audio

experiment:
  name: resnet_ictx_base_balanced_w40
  seed: 42

input:
  type:        spectral
  sr:          24000
  n_mics:      4
  n_fft:       1024
  hop_length:  240
  compute_iv:  true

spatial_early:
  type:           resnet_block
  n_layers:       2
  out_channels:   64
  d_model:        128
  use_msca:       true
  msca_reduction: 4
  dropout:        0.1

spatial_late:
  type:     track_transformer
  n_layers: 2
  d_model:  128
  n_heads:  4
  n_tracks: 3
  dropout:  0.1

track_smoothing:
  type:        bigru
  hidden_size: 256
  n_layers:    1
  dropout:     0.1

heads:
  n_tracks:  3
  n_classes: 13
  proj_dim:  null

cross_stitch:
  cs_early_enabled: false
  cs_late_enabled:  false

training:
  dataset_mode:     BalancedSTARSS23
  epochs:           100
  batch_size:       2       # effective_batch=32 via accumulate_grad_batches=16
  patience:         30
  beta_sed:         0.9
  focal_gamma:      2.0
  pos_weight_max:   20.0
  angle_thresh:     20.0
  lr:               3.0e-4
  scheduler:        reduce_on_plateau
  lr_reduce_factor: 0.75
  lr_patience:      5
  lr_min:           1.0e-5

augmentation:
  enabled:      true
  p_16patterns: 0.50
  p_gain:       0.20
  p_noise:      0.20
  gain_min:     0.3
  gain_max:     0.9
  noise_snr_db: 35.0
  spec_augment:
    enabled:         false
    n_freq_masks:    2
    freq_mask_param: 20
    n_time_masks:    2
    time_mask_param: 30

data:
  window_s:     40.0
  hop_s:        2.0
  val_fraction: 0.2
  val_seed:     42
  num_workers:  4
