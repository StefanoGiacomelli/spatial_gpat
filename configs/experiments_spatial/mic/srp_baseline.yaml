# SpatialSRPModel — baseline configuration (STARSS23 MIC format)
# ==============================================================
# NeuralSRPEncoder backbone + DOA / activity / distance heads.
# Trained from scratch on STARSS23 (MIC) with class-agnostic targets.
#
# Temporal alignment
# ------------------
#   STARSS23.ORIG_SR = 24000 Hz.  Audio is returned at orig_sr (no resampling).
#   encoder hop_size = 240 samples @ 24kHz → 100 Hz frame rate.
#   data hop_length  = 240 samples @ 24kHz → same 100 Hz rate.
#   Both match the CSV 100ms annotation resolution (1 mel frame = 1 CSV frame).
#   Encoder T_enc = (T_samples - win_size) // hop_size + 1
#   Dataset T_mel = 1 + T_samples // hop_length
#   Difference ≤ 1 frame; handled by min-truncation in the training step.

experiment:
  name: srp_baseline
  seed: 42

# ── Encoder ─────────────────────────────────────────────────────────────────
encoder:
  n_mics:            4
  win_size:          480       # 20 ms at 24 kHz
  hop_size:          240       # 10 ms — 100 Hz frame rate
  tau_max:           32        # GCC lag range: 2×tau_max = 64 bins
  n_conv_channels:   128       # aligned to original nb_cnn2d_filt=128
  n_conv_layers:     3
  f_pool_size:       [2, 2, 2]
  t_pool_size:       [1, 1, 1]
  dropout_rate:      0.1
  rnn_hidden:        128       # aligned to original rnn_size=128
  n_rnn_layers:      2         # aligned to original nb_rnn_layers=2
  fnn_pairwise_size: 128       # aligned to original fnn_pairwise_size=128
  d_out:             256
  pair_agg_mode:     sum       # aligned to original pair_agg_mode=sum
  metadata_fusion:   late_concat
  bidirectional:     true

  # Microphone positions (n_mics × 3) in metres.
  # Tetrahedral approximation of a 4-capsule array (radius ≈ 4.2 cm).
  # Replace with the actual array geometry for your recording setup.
  mic_positions:
    - [ 0.0,    0.0,   0.042]
    - [ 0.042,  0.0,   0.0  ]
    - [ 0.0,    0.042, 0.0  ]
    - [-0.042,  0.0,   0.0  ]

# ── Heads ───────────────────────────────────────────────────────────────────
heads:
  n_tracks: 2

# ── Data ────────────────────────────────────────────────────────────────────
data:
  root:         /path/to/STARSS23    # REPLACE with actual dataset path
  sr:           24000                # must equal STARSS23.ORIG_SR
  hop_length:   240                  # must equal encoder.hop_size
  window_s:     10.0                 # 10-second windows
  hop_s:        5.0                  # 50 % overlap
  num_workers:  4
  val_fraction: 0.2
  val_seed:     42

# ── Training ─────────────────────────────────────────────────────────────────
training:
  lr:           1.0e-4
  epochs:       100
  batch_size:   4

  loss_type:    pit      # 'pit' (default) or 'hnet'

  # Pretrained HNetGRU(max_len=2) checkpoint.
  # Ported from the original neural_srp distribution into our codebase.
  # Required only when loss_type: hnet.
  hnet_ckpt:    spatial_modules/pretrained/hnet_model.h5

  lambda_act:   1.0
  lambda_doa:   1.0
  lambda_dist:  0.5

  # HNet-specific weights (ignored when loss_type: pit)
  dMOTP_wt:     1.0
  dMOTA_wt:     1.0
  IDS_wt:       1.0

  checkpoint_monitor: val_lf   # Localization F-score — mode=max
