experiment:
  name: at2sed_bce
  seed: 42

model:
  n_cls: 456

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained}

# ── Training ──────────────────────────────────────────────────────────────────
training:
  loss:                      bce

  weighted_sampler:          true
  balanced_sampler_formula:  psla      # psla | maxpos
  pos_weight_max:            20.0      # cap on per-class positive weight
  class_balance:             false
  rare_class_threshold:      0.1
  max_negative_fraction:     1.0

  omap_enabled:              false     # set true to compute oMAP during validation
  omap_every_n:              5         # compute oMAP every N validation epochs

  # Checkpoint monitor — use val_map_macro (default) or val_omap (if omap_enabled)
  checkpoint_monitor:        val_map_macro

  inference_threshold:       0.5       # sigmoid threshold for F1/Precision/Recall
