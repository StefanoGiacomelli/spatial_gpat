# AT2SED — BCE loss, window 1.0s (EPANNs SR = 32 kHz)
# =====================================================================
# Same as at2sed_bce.yaml but with a fixed input window of 1.0s.
# Window sweep: enables comparison across temporal receptive field sizes
# with sample rate aligned to the EPANNs semantic backbone (32 kHz).
#
# Run with:
#   python main_at2sed.py --exp at2sed_bce_1s

experiment:
  name: at2sed_bce_1s
  seed: 42

model:
  n_cls: 456

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained}

data:
  window_s: 1.0            # input window duration in seconds
  hop_s:    1.0            # non-overlapping (hop = window, no data overlap)

training:
  loss:                      bce

  weighted_sampler:          true
  balanced_sampler_formula:  psla      # psla | maxpos
  pos_weight_max:            20.0
  class_balance:             false
  rare_class_threshold:      0.1
  max_negative_fraction:     1.0

  omap_enabled:              false
  omap_every_n:              5

  checkpoint_monitor:        val_map_macro
  inference_threshold:       0.5
