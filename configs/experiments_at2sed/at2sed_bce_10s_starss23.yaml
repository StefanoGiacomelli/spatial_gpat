# AT2SED — BCE loss, window 10.0s, STARSS23 dataset
# =====================================================================
# Fine-tunes the EPANNs backbone with a 13-class projection head
# (head_starss: Linear 456→13) on STARSS23 data.
#
# Training mode: dataset=starss23, head=starss23(13), loss=BCE only.
# HLP: always disabled (no AudioSet-Strong label graph for 13 classes).
# OBCE: not supported (no 13×13 distance matrix).
#
# head_starss is soft-prior initialised from the AudioSet-Strong →
# STARSS23 class mapping; fc_audioset (456) weights are preserved from
# the pretrained checkpoint.
#
# Run with:
#   python main_at2sed.py --config-file configs/experiments_at2sed/at2sed_bce_10s_starss23.yaml

experiment:
  name: at2sed_bce_10s_starss23
  seed: 42
  dataset: starss23           # activates STARSS23SEDDataModule + head_starss
  hlp_enabled: false          # always disabled for STARSS23 mode

model:
  n_cls: 13                   # STARSS23 class count

semantic:
  checkpoint: semantic_backbone/epanns/checkpoint_closeto_.44.pt
  early_group: {init: pretrained, frozen: false}
  late_group:  {init: pretrained, frozen: false}
  head_group:  {init: pretrained}

data:
  starss_root: data/STARSS23
  window_s:    10.0
  hop_s:       10.0
  val_fraction: 0.2
  val_seed:     42

training:
  loss:                      bce

  weighted_sampler:          true
  pos_weight_max:            20.0

  checkpoint_monitor:        val_map_macro
  inference_threshold:       0.5

augmentation:
  enabled: false
